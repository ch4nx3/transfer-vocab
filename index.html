                          class="c-quiz-btn primary" 
                          id="c-quiz-submit-btn">
                    정답 제출 ↵
                  </button>
                  <button type="button" 
                          class="c-quiz-btn outline" 
                          id="c-quiz-skip-btn">
                    모름 / 건너뛰기 ⏭️
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;

      this._bindActiveQuizEvents(q);

      // Auto Focus Input Field
      setTimeout(() => {
        const input = this.container.querySelector('#c-quiz-answer-input');
        if (input) {
          input.focus();
          if (existingAnswer) {
            input.select();
          }
        }
      }, 80);
    }

    _bindActiveQuizEvents(question) {
      if (!this.container) return;

      const form = this.container.querySelector('#c-quiz-form');
      const input = this.container.querySelector('#c-quiz-answer-input');
      const clearBtn = this.container.querySelector('#c-quiz-input-clear');
      const prevBtn = this.container.querySelector('#c-quiz-prev-btn');
      const skipBtn = this.container.querySelector('#c-quiz-skip-btn');
      const speakBtn = this.container.querySelector('#c-quiz-speak-btn');
      const homeBtn = this.container.querySelector('#c-quiz-home-btn');
      const soundBtn = this.container.querySelector('#c-quiz-sound-toggle');

      if (input && clearBtn) {
        input.addEventListener('input', () => {
          clearBtn.style.display = input.value.trim() ? 'block' : 'none';
        });
        clearBtn.addEventListener('click', () => {
          input.value = '';
          clearBtn.style.display = 'none';
          input.focus();
        });
      }

      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = input ? input.value.trim() : '';
          if (!val) {
            this.skipCurrentQuestion();
          } else {
            this.submitCurrentAnswer(val);
          }
        });
      }

      if (skipBtn) {
        skipBtn.addEventListener('click', () => {
          this.skipCurrentQuestion();
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          this.prevQuestion();
        });
      }

      if (speakBtn) {
        speakBtn.addEventListener('click', () => {
          this.speakWord(question.word);
        });
      }

      if (homeBtn) {
        homeBtn.addEventListener('click', () => {
          this._confirmExit();
        });
      }

      if (soundBtn) {
        soundBtn.addEventListener('click', () => {
          this.sound.muted = !this.sound.muted;
          soundBtn.textContent = this.sound.muted ? '🔇' : '🔊';
          this.showToast(this.sound.muted ? '소리 꺼짐' : '소리 켜짐');
        });
      }
    }

    /**
     * 답안 제출 및 스마트 채점
     */
    submitCurrentAnswer(userText) {
      if (this.isSubmitting) return;
      this.isSubmitting = true;

      const q = this.currentSession.questions[this.currentIndex];
      const result = this.engine.submitAnswer(q.id, userText);
      const answerRecord = result.answerResult;

      // Play Sound
      if (answerRecord.isCorrect) {
        this.sound.play('correct');
        this.streak++;
      } else {
        this.sound.play('wrong');
        this.streak = 0;
      }

      // Show Instant Feedback
      this._showInstantFeedback(answerRecord, () => {
        this.isSubmitting = false;
        this.currentIndex++;
        if (this.currentIndex >= this.currentSession.questions.length) {
          this.finishQuiz();
        } else {
          this._renderActiveQuiz();
        }
      });
    }

    /**
     * 건너뛰기 / 모름
     */
    skipCurrentQuestion() {
      if (this.isSubmitting) return;
      this.isSubmitting = true;

      const q = this.currentSession.questions[this.currentIndex];
      const result = this.engine.submitAnswer(q.id, '모름');
      const answerRecord = result.answerResult;

      this.sound.play('wrong');
      this.streak = 0;

      this._showInstantFeedback(answerRecord, () => {
        this.isSubmitting = false;
        this.currentIndex++;
        if (this.currentIndex >= this.currentSession.questions.length) {
          this.finishQuiz();
        } else {
          this._renderActiveQuiz();
        }
      });
    }

    /**
     * 이전 문항 이동
     */
    prevQuestion() {
      if (this.currentIndex > 0) {
        this.currentIndex--;
        this.editingMode = true;
        this._renderActiveQuiz();
      }
    }

    /**
     * 정답/오답 즉각 피드백 배너 노출
     */
    _showInstantFeedback(answerRecord, callback) {
      const banner = this.container.querySelector('#c-quiz-live-feedback');
      if (!banner) {
        callback();
        return;
      }

      const isCorrect = answerRecord.isCorrect;
      banner.style.display = 'block';
      banner.className = `c-quiz-feedback-banner ${isCorrect ? 'correct' : 'wrong'}`;

      if (isCorrect) {
        banner.innerHTML = `
          <div class="c-fb-icon">🎉</div>
          <div class="c-fb-content">
            <strong>정답입니다!</strong> ${answerRecord.feedback || '훌륭합니다!'}
          </div>
        `;
      } else {
        banner.innerHTML = `
          <div class="c-fb-icon">💡</div>
          <div class="c-fb-content">
            <strong>오답입니다.</strong> 출제 정답: <em>[${answerRecord.refinedMeaning || answerRecord.correctMeaning}]</em>
          </div>
        `;
      }

      // Next after 420ms
      setTimeout(() => {
        callback();
      }, isCorrect ? 350 : 750);
    }

    /**
     * 시험 종료 및 클리닉 화면 전환
     */
    finishQuiz() {
      this._stopTimer();
      this._detachListeners();
      this.isFinished = true;

      const summary = this.engine.completeDayQuiz();
      this.sound.play('complete');

      // Update mobile UX progress if linked
      if (this.mobileUx && typeof this.mobileUx.render === 'function') {
        this.mobileUx.render();
        if (this.mobileUx.container) {
          const fresh = this.mobileUx.container.querySelector('#c-ux-test-view');
          if (fresh) this.container = fresh;
        }
      }

      this._renderClinicScreen(summary);
    }

    /**
     * 1:1 오답 클리닉 종합 화면 렌더링
     */
    _renderClinicScreen(summary) {
      if (!this.container) return;

      const session = this.currentSession;
      const questions = session.questions;
      const answers = session.answers || {};

      const total = session.totalCount || questions.length;
      const correct = session.correctCount;
      const wrong = session.wrongCount;
      const score = session.score;
      const accuracy = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;

      // Grade Info
      let gradeLabel = '🏆 만점 합격권';
      let gradeColor = '#065f46';
      let comment = '서·성·한 최상위권 편입영어 기출 어휘를 완벽히 장악했습니다!';
      if (score < 60) {
        gradeLabel = '🚨 집중 클리닉 필수';
        gradeColor = '#b91c1c';
        comment = '기본 의미 및 빈출 동의어 암기가 시급합니다. 오답 재시험을 통해 즉시 보완하세요.';
      } else if (score < 75) {
        gradeLabel = '🥉 분발 권장';
        gradeColor = '#c2410c';
        comment = '기본기는 있으나 다의어와 변별력 고난도 기출 어휘에서 실수가 발생했습니다.';
      } else if (score < 90) {
        gradeLabel = '🥈 우수 합격권';
        gradeColor = '#1d4ed8';
        comment = '안정적인 상위권 점수입니다! 오답 단어를 누적 복습 풀에서 완전히 정복하세요.';
      } else if (score < 100) {
        gradeLabel = '🥇 최우수 합격권';
        gradeColor = '#059669';
        comment = '서강대·성균관대·한양대 1차 합격권 최상위 실력입니다. 만점을 목표로 정진하세요!';
      }

      // Cascading pool stats
      const unmasteredPoolCount = summary.unmasteredPoolCount !== undefined 
        ? summary.unmasteredPoolCount 
        : this.engine.getUnmasteredPool().length;

      // Generate items list data
      const itemsList = questions.map((q, idx) => {
        const ans = answers[q.id] || { isCorrect: false, userAnswer: '(미응답)', feedback: '' };
        return {
          idx: idx + 1,
          wordItem: q,
          userAnswer: ans.userAnswer || ans.studentAnswer || '(미응답)',
          isCorrect: ans.isCorrect,
          feedback: ans.feedback,
          isCarriedOver: q.isCarriedOver,
          isRetest: q.isRetest
        };
      });

      this.lastClinicItems = itemsList;
      this.lastClinicSummary = summary;

      // Filtered items count
      const wrongCount = itemsList.filter(i => !i.isCorrect).length;
      const correctCount = itemsList.filter(i => i.isCorrect).length;

      this.container.innerHTML = `
        <div class="c-clinic-viewport">
          <!-- Printable Report Header -->
          <div class="c-clinic-print-header">
            <h1>서·성·한 편입영어 10일 완성 계단식 보카 - Day ${this.currentDay} 오답 클리닉 리포트</h1>
            <p>응시 일시: ${new Date().toLocaleString('ko-KR')} | 총점: ${score}점 (${correct}/${total} 정답)</p>
          </div>

          <!-- Hero Score Card -->
          <div class="c-clinic-hero-card">
            <div class="c-clinic-hero-badge" style="background: ${gradeColor}18; color: ${gradeColor}; border: 1px solid ${gradeColor}40;">
              ${gradeLabel}
            </div>

            <div class="c-clinic-score-row">
              <div class="c-clinic-score-circle">
                <span class="c-clinic-score-num">${score}</span>
                <span class="c-clinic-score-unit">점</span>
              </div>
              <div class="c-clinic-metrics-col">
                <div class="c-clinic-metric-item">
                  <span class="c-clinic-metric-label">정답 문항</span>
                  <span class="c-clinic-metric-val success">${correct}개</span>
                </div>
                <div class="c-clinic-metric-item">
                  <span class="c-clinic-metric-label">오답 문항</span>
                  <span class="c-clinic-metric-val danger">${wrong}개</span>
                </div>
                <div class="c-clinic-metric-item">
                  <span class="c-clinic-metric-label">정답률</span>
                  <span class="c-clinic-metric-val">${accuracy}%</span>
                </div>
              </div>
            </div>

            <p class="c-clinic-comment">${comment}</p>

            <!-- Cascading Spaced Repetition Diagnostics Table -->
            <div class="c-clinic-cascading-box">
              <div class="c-clinic-cascading-title">
                <span>🔄 폭포수 누적 복습 진단</span>
                <span class="c-clinic-pool-badge">누적 미정복 오답 풀: <strong>${unmasteredPoolCount}단어</strong></span>
              </div>
              <div class="c-clinic-cascading-grid">
                <div class="c-clinic-cascading-cell">
                  <span class="sub">당일 신규 (Day ${this.currentDay})</span>
                  <strong>${summary.newWordsTotal || total}문항</strong>
                  <span class="detail">정답 ${summary.newWordsMastered || correct} / 오답 ${summary.newWordsFailed || wrong}</span>
                </div>
                <div class="c-clinic-cascading-cell">
                  <span class="sub">이전 Day 누적 이월</span>
                  <strong>${summary.carriedOverTotal || 0}문항</strong>
                  <span class="detail success">마스터(정복) ${summary.carriedOverMastered || 0}개 🎉</span>
                </div>
              </div>
            </div>

            <!-- Primary Action Buttons Bar -->
            <div class="c-clinic-actions-bar">
              <button type="button" 
                      class="c-clinic-btn primary-retest" 
                      id="c-clinic-retest-btn" 
                      ${wrong === 0 ? 'disabled' : ''}>
                ${wrong === 0 ? '🎉 오답 없음 (만점!)' : `🔄 오답 단어 즉시 재시험 (${wrong}제)`}
              </button>

              <button type="button" class="c-clinic-btn copy-notes" id="c-clinic-copy-btn">
                📋 오답노트 클립보드 복사
              </button>

              ${this.currentDay < 10 ? `
                <button type="button" class="c-clinic-btn next-day" id="c-clinic-next-day-btn">
                  ➡️ 다음 Day ${this.currentDay + 1}로 이동
                </button>
              ` : `
                <button type="button" class="c-clinic-btn next-day graduation" id="c-clinic-grad-btn">
                  🎓 10일 완성 전과정 마스터!
                </button>
              `}

              <div class="c-clinic-aux-actions">
                <button type="button" class="c-clinic-btn outline" id="c-clinic-flashcards-btn">
                  🗂️ 플래시카드로 복습
                </button>
                <button type="button" class="c-clinic-btn outline print-hide" id="c-clinic-print-btn">
                  🖨️ 클리닉 인쇄 / PDF 저장
                </button>
              </div>
            </div>
          </div>

          <!-- Filter Tabs -->
          <div class="c-clinic-filter-bar">
            <button type="button" class="c-clinic-tab ${this.currentFilter === 'all' ? 'active' : ''}" data-filter="all">
              전체 문항 (${total})
            </button>
            <button type="button" class="c-clinic-tab ${this.currentFilter === 'incorrect' ? 'active' : ''}" data-filter="incorrect">
              오답 단어 (${wrongCount})
            </button>
            <button type="button" class="c-clinic-tab ${this.currentFilter === 'mastered' ? 'active' : ''}" data-filter="mastered">
              정답·마스터 (${correctCount})
            </button>
          </div>

          <!-- Words Clinic Cards List Container -->
          <div class="c-clinic-cards-list" id="c-clinic-cards-container">
            ${this._renderFilteredCardsHtml(itemsList, this.currentFilter)}
          </div>
        </div>
      `;

      this._bindClinicEvents();
    }

    _renderFilteredCardsHtml(itemsList, filterType) {
      let filtered = itemsList;
      if (filterType === 'incorrect') {
        filtered = itemsList.filter(i => !i.isCorrect);
      } else if (filterType === 'mastered') {
        filtered = itemsList.filter(i => i.isCorrect);
      }

      if (filtered.length === 0) {
        return `
          <div class="c-clinic-empty-box">
            <div style="font-size: 36px; margin-bottom: 8px;">✨</div>
            <p>해당 조건에 일치하는 문항이 없습니다.</p>
          </div>
        `;
      }

      return filtered.map(item => {
        const q = item.wordItem;
        const isOk = item.isCorrect;
        const univ = q.univ || '서·성·한';

        let univClass = 'c-ux-badge-multi';
        if (univ.includes('서강')) univClass = 'c-ux-badge-sogang';
        else if (univ.includes('성균')) univClass = 'c-ux-badge-skku';
        else if (univ.includes('한양')) univClass = 'c-ux-badge-hanyang';

        let carriedBadge = '';
        if (item.isCarriedOver) {
          carriedBadge = `<span class="c-quiz-type-badge carried" style="font-size:11px; padding:2px 8px;">🔄 누적 이월</span>`;
        }

        // Highlight sentence
        let sentenceHtml = q.sentence || '';
        if (sentenceHtml && q.word) {
          const regex = new RegExp(`\\b(${q.word}[a-z]*)\\b`, 'gi');
          sentenceHtml = sentenceHtml.replace(regex, '<span class="c-quiz-hl">$1</span>');
        }

        // Synonym pills
        const synList = (q.synonyms || '').split(',').map(s => s.trim()).filter(Boolean);

        return `
          <div class="c-clinic-word-card ${isOk ? 'correct' : 'wrong'}">
            <div class="c-clinic-word-header">
              <div class="c-clinic-left-meta">
                <span class="c-clinic-num-pill">${item.idx}</span>
                <span class="c-ux-badge ${univClass}">${univ}</span>
                <span class="c-quiz-year-badge">${q.year || ''} ${q.q_num || ''}</span>
                ${carriedBadge}
              </div>
              <span class="c-clinic-status-badge ${isOk ? 'correct' : 'wrong'}">
                ${isOk ? '✅ 정답' : '❌ 오답'}
              </span>
            </div>

            <div class="c-clinic-word-title-row">
              <h3 class="c-clinic-word-name">${q.word}</h3>
              <span class="c-quiz-pos-label">[${q.pos || ''}]</span>
              <button type="button" class="c-quiz-tts-btn c-clinic-tts" data-word="${q.word}" title="발음 듣기">🔊</button>
            </div>

            <!-- Answer comparison row -->
            <div class="c-clinic-answer-box ${isOk ? 'correct' : 'wrong'}">
              <div class="c-clinic-answer-row">
                <span class="label">제출 답안:</span>
                <strong class="val ${isOk ? 'success' : 'danger'}">${item.userAnswer || '(미응답 / 스킵)'}</strong>
              </div>
              <div class="c-clinic-answer-row">
                <span class="label">출제 정답:</span>
                <strong class="val answer-highlight">${q.meaning}</strong>
              </div>
            </div>

            <!-- Synonyms -->
            ${synList.length > 0 ? `
              <div class="c-clinic-synonyms-row">
                <span class="sub-label">동의어:</span>
                <div class="c-clinic-syn-chips">
                  ${synList.map(s => `<span class="c-clinic-syn-chip">${s}</span>`).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Context Sentence & Korean Translation -->
            ${sentenceHtml ? `
              <div class="c-clinic-sentence-block">
                <div class="en">${sentenceHtml}</div>
                ${q.korean_trans ? `<div class="ko">${q.korean_trans}</div>` : ''}
              </div>
            ` : ''}

            <!-- Tip -->
            ${q.tip ? `
              <div class="c-clinic-tip-box">
                <span class="tip-icon">💡</span>
                <div class="tip-text"><strong>기출 적중 TIP:</strong> ${q.tip}</div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    _bindClinicEvents() {
      if (!this.container) return;

      // Filter Tabs
      const tabs = this.container.querySelectorAll('.c-clinic-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const filter = tab.getAttribute('data-filter');
          this.currentFilter = filter;
          tabs.forEach(t => t.classList.toggle('active', t === tab));
          const listContainer = this.container.querySelector('#c-clinic-cards-container');
          if (listContainer && this.lastClinicItems) {
            listContainer.innerHTML = this._renderFilteredCardsHtml(this.lastClinicItems, this.currentFilter);
            this._bindTtsButtons();
          }
        });
      });

      // Retest Button
      const retestBtn = this.container.querySelector('#c-clinic-retest-btn');
      if (retestBtn) {
        retestBtn.addEventListener('click', () => {
          this.startRetest(this.currentDay);
        });
      }

      // Copy Notes Button
      const copyBtn = this.container.querySelector('#c-clinic-copy-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          this.copyMarkdownToClipboard();
        });
      }

      // Next Day Button
      const nextDayBtn = this.container.querySelector('#c-clinic-next-day-btn');
      if (nextDayBtn) {
        nextDayBtn.addEventListener('click', () => {
          const nextD = this.currentDay + 1;
          if (this.options.onNextDay) {
            this.options.onNextDay(nextD);
          } else if (this.mobileUx) {
            this.mobileUx.selectDay(nextD);
            this.mobileUx.setMode('flashcard');
            this.showToast(`🚀 Day ${nextD} 플래시카드로 이동했습니다!`);
          }
        });
      }

      // Back to Flashcards Button
      const flashcardsBtn = this.container.querySelector('#c-clinic-flashcards-btn');
      if (flashcardsBtn) {
        flashcardsBtn.addEventListener('click', () => {
          if (this.mobileUx) {
            this.mobileUx.setMode('flashcard');
          }
        });
      }

      // Print Button
      const printBtn = this.container.querySelector('#c-clinic-print-btn');
      if (printBtn) {
        printBtn.addEventListener('click', () => {
          window.print();
        });
      }

      // TTS buttons
      this._bindTtsButtons();
    }

    _bindTtsButtons() {
      if (!this.container) return;
      const ttsBtns = this.container.querySelectorAll('.c-clinic-tts');
      ttsBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const word = btn.getAttribute('data-word');
          if (word) this.speakWord(word);
        });
      });
    }

    /**
     * 오답노트 마크다운 클립보드 복사
     */
    copyMarkdownToClipboard() {
      if (!this.lastClinicItems) return;

      const items = this.lastClinicItems;
      const summary = this.lastClinicSummary || {};
      const wrongItems = items.filter(i => !i.isCorrect);

      const total = items.length;
      const correct = items.filter(i => i.isCorrect).length;
      const accuracy = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
      const nowStr = new Date().toLocaleString('ko-KR');

      let md = `# 🎯 서·성·한 편입영어 10일 완성 계단식 보카 - Day ${this.currentDay} 오답 클리닉 노트\n\n`;
      md += `> **응시 일시**: ${nowStr}\n`;
      md += `> **종합 성적**: ${summary.score || 0}점 (${correct} / ${total} 문항 정답, 정답률 ${accuracy}%)\n`;
      md += `> **누적 복습 현황**: 당일 신규 ${summary.newWordsMastered || correct}/${summary.newWordsTotal || total} 정답 | 이전 누적 이월 ${summary.carriedOverMastered || 0}/${summary.carriedOverTotal || 0} 마스터 완료\n`;
      md += `> **현재 잔여 미정복 오답 풀**: ${summary.unmasteredPoolCount !== undefined ? summary.unmasteredPoolCount : this.engine.getUnmasteredPool().length}단어 (다음 일차 시험에 자동 반영)\n\n`;
      md += `---\n\n`;

      if (wrongItems.length === 0) {
        md += `🎉 **오답 없음 (100% 만점)! Day ${this.currentDay}의 모든 기출 어휘를 완벽히 마스터했습니다!**\n`;
      } else {
        md += `### 📌 집중 복습 오답 단어 목록 (${wrongItems.length}문항)\n\n`;
        wrongItems.forEach((item, idx) => {
          const q = item.wordItem;
          const userAns = item.userAnswer && item.userAnswer.trim() ? item.userAnswer.trim() : '(미응답 / 스킵)';
          const tag = item.isCarriedOver ? ' [🔄 이전 누적 복습]' : '';

          md += `#### ${idx + 1}. ${q.word} [${q.pos || ''}] - ${q.univ || ''} ${q.year || ''} (${q.q_num || ''})${tag}\n`;
          md += `- **출제 정답**: ${q.meaning}\n`;
          md += `- **제출 답안**: ${userAns} ❌\n`;
          if (q.synonyms) {
            md += `- **필수 동의어**: ${q.synonyms}\n`;
          }
          if (q.sentence) {
            md += `- **기출 예문**: ${q.sentence}\n`;
          }
          if (q.korean_trans) {
            md += `- **예문 해석**: ${q.korean_trans}\n`;
          }
          if (q.tip) {
            md += `- **💡 과외 적중 TIP**: ${q.tip}\n`;
          }
          md += `\n`;
        });
      }

      // Clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(md).then(() => {
          this.showToast('📋 오답노트가 클립보드에 복사되었습니다! (노션/블로그 붙여넣기 가능)');
        }).catch(() => {
          this._fallbackCopyText(md);
        });
      } else {
        this._fallbackCopyText(md);
      }
    }

    _fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        this.showToast('📋 오답노트가 클립보드에 복사되었습니다!');
      } catch (err) {
        alert('클립보드 복사에 실패했습니다. 수동으로 복사해주세요.');
      }
      document.body.removeChild(textarea);
    }

    speakWord(word) {
      if (typeof window === 'undefined' || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }

    showToast(message) {
      if (typeof document === 'undefined') return;
      const existing = document.querySelector('.c-quiz-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'c-quiz-toast';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('visible');
      }, 10);

      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 250);
      }, 2600);
    }

    _confirmExit() {
      if (confirm('시험을 중단하고 홈으로 돌아가시겠습니까?\n현재까지 진행 중인 시험 답안은 완료 저장되지 않습니다.')) {
        this._stopTimer();
        this._detachListeners();
        if (this.options.onExitHome) {
          this.options.onExitHome();
        } else if (this.mobileUx) {
          this.mobileUx.setMode('flashcard');
        }
      }
    }

    destroy() {
      this._stopTimer();
      this._detachListeners();
    }
  }

  return CascadingQuizRunner;
}));

  </script>

  <!-- [4] Integrated Application Controller -->
  <script>
    (function () {
      'use strict';

      document.addEventListener('DOMContentLoaded', function () {
        const engine = window.CascadingEngine || (window.CascadingStateEngine ? (typeof window.CascadingStateEngine === 'function' ? new window.CascadingStateEngine() : window.CascadingStateEngine) : null);
        if (!engine) {
          console.error('[App] CascadingStateEngine could not be initialized.');
          return;
        }

        let quizRunner = null;

        // Initialize Mobile UX Component
        const mobileApp = window.CascadingMobileUX.mount('#cascading-app', {
          initialDay: 1,
          initialMode: 'flashcard',
          cascadingEngine: engine,

          onDayChange: function (day, words) {
            updateTestBriefing(day);
          },

          onModeChange: function (mode, day) {
            if (mode === 'test') {
              updateTestBriefing(day);
            }
          },

          onStartTest: function (day, words) {
            launchTest(day);
          }
        });

        // Function to render test briefing or start quiz inside #c-ux-test-view
        function updateTestBriefing(day) {
          const testView = document.querySelector('#c-ux-test-view');
          if (!testView) return;

          const d = parseInt(day, 10);
          const words = engine.getWordsForDay(d);
          const unmasteredPool = engine.getUnmasteredPool();
          const pastRecord = engine.state.dailyRecords ? engine.state.dailyRecords[d] : null;

          const baseCount = words.length;
          const carriedOverCount = unmasteredPool.length;
          const totalQuestions = baseCount + carriedOverCount;

          testView.innerHTML = `
            <div class="c-ux-card-shell" style="min-height: 320px; text-align: center; justify-content: center; align-items: center; gap: 16px; padding: 28px 20px;">
              <div style="font-size: 46px;">✍️</div>
              <h2 style="font-size: 22px; font-weight: 800; color: var(--c-ux-navy-900); margin: 0;">
                Day ${d} 실전 일차 테스트
              </h2>
              <p style="font-size: 14px; color: var(--c-ux-text-secondary); max-width: 360px; line-height: 1.55; margin: 0;">
                서·성·한 편입영어 최신기출 주관식 어휘 채점 & 오답 누적 복습
              </p>

              <!-- Test Composition Card -->
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 13.5px;">
                <div style="display: flex; justify-content: space-between;">
                  <span style="color: #64748b;">당일 신규 진도:</span>
                  <strong style="color: #0f172a;">${baseCount}문항</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                  <span style="color: #64748b;">이전 Day 누적 복습:</span>
                  <strong style="color: ${carriedOverCount > 0 ? '#b45309' : '#059669'};">
                    ${carriedOverCount > 0 ? `+${carriedOverCount}문항 (이월)` : '0문항 (클린 ✨)'}
                  </strong>
                </div>
                <div style="border-top: 1px solid #e2e8f0; padding-top: 6px; display: flex; justify-content: space-between; font-weight: 800;">
                  <span>총 출제 문항:</span>
                  <span style="color: #4338ca;">${totalQuestions}문항</span>
                </div>
              </div>

              ${pastRecord ? `
                <div style="background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; color: #065f46;">
                  이전 완료 기록: <strong>${pastRecord.score}점</strong> (${pastRecord.correctCount}/${pastRecord.totalQuestions} 정답)
                </div>
              ` : ''}

              <div style="display: flex; gap: 10px; width: 100%; max-width: 360px; margin-top: 6px;">
                <button type="button" class="c-ux-nav-btn" id="c-briefing-back-btn" style="flex: 1; padding: 0 14px;">
                  ◀ 플래시카드
                </button>
                <button type="button" class="c-ux-nav-btn primary" id="c-briefing-start-btn" style="flex: 1.6; padding: 0 16px;">
                  🚀 테스트 시작
                </button>
              </div>

              ${pastRecord && pastRecord.wrongWordIds && pastRecord.wrongWordIds.length > 0 ? `
                <button type="button" class="c-ux-tool-btn" id="c-briefing-retest-btn" style="width: 100%; max-width: 360px; margin-top: 4px; color: #dc2626;">
                  ⚡ 직전 오답 ${pastRecord.wrongWordIds.length}제 즉시 재시험
                </button>
              ` : ''}
            </div>
          `;

          // Bind buttons
          const backBtn = testView.querySelector('#c-briefing-back-btn');
          const startBtn = testView.querySelector('#c-briefing-start-btn');
          const retestBtn = testView.querySelector('#c-briefing-retest-btn');

          if (backBtn) {
            backBtn.addEventListener('click', () => {
              mobileApp.setMode('flashcard');
            });
          }
          if (startBtn) {
            startBtn.addEventListener('click', () => {
              launchTest(d);
            });
          }
          if (retestBtn) {
            retestBtn.addEventListener('click', () => {
              launchRetest(d);
            });
          }
        }

        function activateTestView() {
          mobileApp.currentMode = 'test';
          if (mobileApp.container) {
            const flashcardView = mobileApp.container.querySelector('#c-ux-flashcard-view');
            const testView = mobileApp.container.querySelector('#c-ux-test-view');
            if (flashcardView) flashcardView.classList.add('hidden');
            if (testView) testView.classList.add('active');
            const modeBtns = mobileApp.container.querySelectorAll('.c-ux-mode-btn');
            modeBtns.forEach(btn => {
              btn.classList.toggle('active', btn.getAttribute('data-mode') === 'test');
            });
          }
          return document.querySelector('#c-ux-test-view');
        }

        function launchTest(day) {
          const testView = activateTestView();
          if (!testView) return;

          if (!quizRunner) {
            quizRunner = new window.CascadingQuizRunner({
              container: testView,
              engine: engine,
              mobileUx: mobileApp,
              onExitHome: function () {
                mobileApp.setMode('flashcard');
              },
              onNextDay: function (nextDay) {
                mobileApp.selectDay(nextDay);
                mobileApp.setMode('flashcard');
                if (typeof mobileApp.showToast === 'function') {
                  mobileApp.showToast(`🚀 Day ${nextDay}로 이동했습니다!`);
                }
              }
            });
          } else {
            quizRunner.container = testView;
          }

          quizRunner.startDayTest(day);
        }

        function launchRetest(day) {
          const testView = activateTestView();
          if (!testView) return;

          if (!quizRunner) {
            quizRunner = new window.CascadingQuizRunner({
              container: testView,
              engine: engine,
              mobileUx: mobileApp,
              onExitHome: function () {
                mobileApp.setMode('flashcard');
              },
              onNextDay: function (nextDay) {
                mobileApp.selectDay(nextDay);
                mobileApp.setMode('flashcard');
              }
            });
          } else {
            quizRunner.container = testView;
          }

          quizRunner.startRetest(day);
        }

        // Expose globally for debugging / test harness
        window.app = {
          engine: engine,
          mobileApp: mobileApp,
          get quizRunner() { return quizRunner; },
          launchTest: launchTest,
          launchRetest: launchRetest
        };

        console.log('🎯 [CascadingVocabApp] 10-Day Standalone Learning System successfully initialized!');
      });
    })();
  </script>
</body>
</html>
