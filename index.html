/* ==========================================================================
   Quiz Runner & Mobile Keyboard Optimization CSS
   ========================================================================== */
.c-quiz-viewport {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: cUxFadeIn 0.15s ease-out;
}

.c-quiz-top-bar {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-md);
  padding: 12px 14px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: sticky;
  top: 10px;
  z-index: 40;
}

.c-quiz-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.c-quiz-day-label {
  font-size: 15px;
  font-weight: 800;
  color: var(--c-ux-navy-900);
  letter-spacing: -0.02em;
  flex: 1;
  text-align: center;
}

.c-quiz-icon-btn {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-sm);
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ux-text-secondary);
  cursor: pointer;
  min-height: 48px;
  min-width: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s;
}
.c-quiz-icon-btn:active {
  background: #e2e8f0;
}

.c-quiz-timer-pill {
  background: #0f172a;
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 4px 10px;
  border-radius: var(--c-ux-radius-pill);
  letter-spacing: 0.04em;
}

.c-quiz-progress-track {
  width: 100%;
  height: 6px;
  background: #f1f5f9;
  border-radius: var(--c-ux-radius-pill);
  overflow: hidden;
}

.c-quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4338ca 0%, #6366f1 100%);
  border-radius: var(--c-ux-radius-pill);
  transition: width 0.2s ease-out;
}

.c-quiz-sub-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--c-ux-text-muted);
}

.c-quiz-counter-text strong {
  color: var(--c-ux-navy-900);
  font-size: 14px;
}

.c-quiz-streak-pill {
  background: #fffbeb;
  color: #b45309;
  border: 1px solid #fde68a;
  padding: 2px 8px;
  border-radius: var(--c-ux-radius-pill);
  font-size: 12px;
  font-weight: 700;
}

.c-quiz-edit-indicator {
  background: #fef2f2;
  color: #991b1b;
  border: 1px solid #fca5a5;
  padding: 2px 8px;
  border-radius: var(--c-ux-radius-pill);
  font-size: 11.5px;
  font-weight: 600;
}

/* Question Card */
.c-quiz-card-wrapper {
  width: 100%;
}

.c-quiz-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-lg);
  box-shadow: var(--c-ux-shadow-card);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.c-quiz-badges-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.c-quiz-year-badge {
  background: #f8fafc;
  color: #475569;
  border: 1px solid #cbd5e1;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--c-ux-radius-pill);
}

.c-quiz-type-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--c-ux-radius-pill);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.c-quiz-type-badge.new {
  background: #eff6ff;
  color: #1e40af;
  border: 1px solid #bfdbfe;
}
.c-quiz-type-badge.carried {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fcd34d;
  box-shadow: 0 1px 3px rgba(180, 83, 9, 0.15);
}
.c-quiz-type-badge.retest {
  background: #fdf2f8;
  color: #9d174d;
  border: 1px solid #fbcfe8;
}

.c-quiz-target-word-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.c-quiz-target-word {
  margin: 0;
  font-size: 32px;
  font-weight: 800;
  color: var(--c-ux-navy-900);
  letter-spacing: -0.02em;
  line-height: 1.15;
  word-break: break-word;
}

.c-quiz-tts-btn {
  background: #eef2ff;
  border: 1px solid #c7d2fe;
  color: #4338ca;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s, transform 0.08s;
}
.c-quiz-tts-btn:active {
  background: #c7d2fe;
  transform: scale(0.94);
}

.c-quiz-pos-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--c-ux-indigo-600);
  background: var(--c-ux-indigo-50);
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: var(--c-ux-radius-sm);
}

.c-quiz-sentence-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-left: 4px solid var(--c-ux-indigo-500);
  border-radius: var(--c-ux-radius-sm);
  padding: 14px 16px;
}

.c-quiz-sentence-en {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--c-ux-text-primary);
}

.c-quiz-hl {
  font-weight: 800;
  color: #4338ca;
  background: #e0e7ff;
  padding: 1px 4px;
  border-radius: 4px;
}

/* Feedback Banner */
.c-quiz-feedback-banner {
  padding: 12px 14px;
  border-radius: var(--c-ux-radius-md);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  animation: cUxFadeIn 0.15s ease-out;
}
.c-quiz-feedback-banner.correct {
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #065f46;
}
.c-quiz-feedback-banner.wrong {
  background: #fffbeb;
  border: 1px solid #fde68a;
  color: #92400e;
}
.c-fb-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.c-fb-content {
  line-height: 1.45;
}

/* Form & Mobile Keyboard Input */
.c-quiz-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 4px;
}

.c-quiz-input-label {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-ux-text-secondary);
}

.c-quiz-input-container {
  position: relative;
  width: 100%;
}

.c-quiz-answer-input {
  width: 100%;
  box-sizing: border-box;
  font-family: inherit;
  font-size: 18px; /* Prevents auto-zoom on iOS */
  padding: 16px 48px 16px 18px;
  border: 2px solid #cbd5e1;
  border-radius: var(--c-ux-radius-md);
  background: #ffffff;
  color: var(--c-ux-navy-900);
  font-weight: 600;
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
  min-height: 56px;
}
.c-quiz-answer-input:focus {
  border-color: var(--c-ux-indigo-500);
  box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
}
.c-quiz-answer-input::placeholder {
  color: #94a3b8;
  font-weight: 400;
  font-size: 15px;
}

.c-quiz-input-clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #e2e8f0;
  border: none;
  color: #475569;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Action Buttons Grid (Touch targets >= 48px) */
.c-quiz-action-grid {
  display: grid;
  grid-template-columns: 1fr 1.6fr 1fr;
  gap: 8px;
  margin-top: 4px;
}

@media (max-width: 400px) {
  .c-quiz-action-grid {
    grid-template-columns: 1fr 1fr;
  }
  .c-quiz-btn.primary {
    grid-column: span 2;
    order: -1;
  }
}

.c-quiz-btn {
  min-height: 48px;
  border-radius: var(--c-ux-radius-md);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  transition: background 0.12s, transform 0.08s, box-shadow 0.12s;
  border: 1px solid transparent;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.c-quiz-btn:active {
  transform: scale(0.97);
}
.c-quiz-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.c-quiz-btn.primary {
  background: linear-gradient(135deg, #4338ca 0%, #312e81 100%);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(67, 56, 202, 0.28);
}
.c-quiz-btn.primary:active {
  box-shadow: 0 2px 6px rgba(67, 56, 202, 0.2);
}

.c-quiz-btn.secondary {
  background: #f1f5f9;
  border-color: #cbd5e1;
  color: var(--c-ux-navy-900);
}

.c-quiz-btn.outline {
  background: #ffffff;
  border-color: #cbd5e1;
  color: #64748b;
}
.c-quiz-btn.outline:active {
  background: #f8fafc;
}

/* ==========================================================================
   Clinic Screen CSS
   ========================================================================== */
.c-clinic-viewport {
  display: flex;
  flex-direction: column;
  gap: 18px;
  animation: cUxFadeIn 0.2s ease-out;
}

.c-clinic-print-header {
  display: none;
}

.c-clinic-hero-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-lg);
  box-shadow: var(--c-ux-shadow-card);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
}

.c-clinic-hero-badge {
  align-self: center;
  padding: 6px 16px;
  border-radius: var(--c-ux-radius-pill);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.c-clinic-score-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 8px 0;
}

.c-clinic-score-circle {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(49, 46, 129, 0.25);
  flex-shrink: 0;
}
.c-clinic-score-num {
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
}
.c-clinic-score-unit {
  font-size: 13px;
  font-weight: 600;
  opacity: 0.85;
}

.c-clinic-metrics-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}

.c-clinic-metric-item {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.c-clinic-metric-label {
  color: var(--c-ux-text-muted);
  min-width: 60px;
}
.c-clinic-metric-val {
  font-weight: 800;
  color: var(--c-ux-navy-900);
}
.c-clinic-metric-val.success {
  color: #059669;
}
.c-clinic-metric-val.danger {
  color: #dc2626;
}

.c-clinic-comment {
  font-size: 14px;
  color: var(--c-ux-text-secondary);
  line-height: 1.55;
  margin: 0;
  background: #f8fafc;
  padding: 12px 14px;
  border-radius: var(--c-ux-radius-md);
  border: 1px solid #e2e8f0;
}

/* Cascading Diagnostics Box */
.c-clinic-cascading-box {
  background: #fefce8;
  border: 1px solid #fef08a;
  border-radius: var(--c-ux-radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
}

.c-clinic-cascading-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 800;
  color: #854d0e;
}

.c-clinic-pool-badge {
  background: #fef08a;
  color: #713f12;
  padding: 3px 8px;
  border-radius: var(--c-ux-radius-pill);
  font-size: 12px;
}

.c-clinic-cascading-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.c-clinic-cascading-cell {
  background: #ffffff;
  border: 1px solid #fef08a;
  border-radius: var(--c-ux-radius-sm);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.c-clinic-cascading-cell .sub {
  font-size: 12px;
  color: #854d0e;
  font-weight: 600;
}
.c-clinic-cascading-cell strong {
  font-size: 16px;
  color: var(--c-ux-navy-900);
}
.c-clinic-cascading-cell .detail {
  font-size: 11.5px;
  color: var(--c-ux-text-muted);
}
.c-clinic-cascading-cell .detail.success {
  color: #059669;
  font-weight: 700;
}

/* Actions Bar */
.c-clinic-actions-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 6px;
}

.c-clinic-btn {
  min-height: 50px;
  border-radius: var(--c-ux-radius-md);
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  transition: background 0.12s, transform 0.08s, box-shadow 0.12s;
  border: 1px solid transparent;
}
.c-clinic-btn:active {
  transform: scale(0.98);
}
.c-clinic-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.c-clinic-btn.primary-retest {
  background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.28);
}

.c-clinic-btn.copy-notes {
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
}

.c-clinic-btn.next-day {
  background: linear-gradient(135deg, #4338ca 0%, #312e81 100%);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(67, 56, 202, 0.28);
}
.c-clinic-btn.next-day.graduation {
  background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
}

.c-clinic-aux-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 4px;
}

.c-clinic-btn.outline {
  background: #ffffff;
  border-color: #cbd5e1;
  color: var(--c-ux-navy-900);
  font-size: 14px;
  min-height: 48px;
}
.c-clinic-btn.outline:active {
  background: #f1f5f9;
}

/* Filter Tabs Bar */
.c-clinic-filter-bar {
  display: flex;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-md);
  padding: 4px;
  gap: 4px;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
}

.c-clinic-tab {
  flex: 1;
  min-height: 48px;
  border-radius: var(--c-ux-radius-sm);
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-ux-text-muted);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.c-clinic-tab.active {
  background: #4338ca;
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(67, 56, 202, 0.22);
}

/* Word Clinic Cards */
.c-clinic-cards-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.c-clinic-word-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-md);
  padding: 16px 18px;
  box-shadow: var(--c-ux-shadow-card);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.c-clinic-word-card.correct {
  border-left: 5px solid #059669;
}
.c-clinic-word-card.wrong {
  border-left: 5px solid #dc2626;
}

.c-clinic-word-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.c-clinic-left-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.c-clinic-num-pill {
  background: #f1f5f9;
  color: #475569;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
}

.c-clinic-status-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--c-ux-radius-pill);
}
.c-clinic-status-badge.correct {
  background: #ecfdf5;
  color: #065f46;
  border: 1px solid #a7f3d0;
}
.c-clinic-status-badge.wrong {
  background: #fef2f2;
  color: #991b1b;
  border: 1px solid #fecaca;
}

.c-clinic-word-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.c-clinic-word-name {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  color: var(--c-ux-navy-900);
}

.c-clinic-answer-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: var(--c-ux-radius-sm);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13.5px;
}
.c-clinic-answer-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.c-clinic-answer-row .label {
  color: var(--c-ux-text-muted);
  min-width: 65px;
}
.c-clinic-answer-row .val.danger {
  color: #dc2626;
}
.c-clinic-answer-row .val.success {
  color: #059669;
}
.c-clinic-answer-row .val.answer-highlight {
  color: #1e1b4b;
  font-weight: 800;
}

.c-clinic-synonyms-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  flex-wrap: wrap;
}
.c-clinic-synonyms-row .sub-label {
  color: var(--c-ux-text-muted);
  font-weight: 600;
}
.c-clinic-syn-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.c-clinic-syn-chip {
  background: #eef2ff;
  color: #3730a3;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
}

      '을', '를', '은', '는', '이', '가', '에', '의', '과', '와', '도', '만', '서', '로',
      '기'
    ],

    normalize(text, isTargetMeaning = false) {
      if (!text || typeof text !== 'string') return '';
      let res = text.toLowerCase();
      if (isTargetMeaning) {
        res = res.replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ');
      }
      return res.replace(/[.,·;:"'`~!?@#$%^&*()_+=\-\[\]{}<>\/\|]/g, ' ').replace(/\s+/g, ' ').trim();
    },

    stripFinalM(syllable) {
      const code = syllable.charCodeAt(0);
      if (code < this.HANGUL_START || code > this.HANGUL_END) return syllable;
      const index = code - this.HANGUL_START;
      const final = index % 28;
      // 종성 16번이 'ㅁ'
      if (final === 16) {
        return String.fromCharCode(code - 16);
      }
      return syllable;
    },

    getStems(word) {
      const stems = new Set();
      const clean = word.trim();
      if (!clean || this.STOPWORDS.has(clean)) return [];
      stems.add(clean);

      for (const suf of this.SUFFIX_PATTERNS) {
        if (clean.length > suf.length && clean.endsWith(suf)) {
          const root = clean.slice(0, -suf.length).trim();
          if (root.length >= 1 && !this.STOPWORDS.has(root)) {
            stems.add(root);
          }
        }
      }

      if (clean.length >= 2) {
        const lastChar = clean.slice(-1);
        const strippedLast = this.stripFinalM(lastChar);
        if (strippedLast !== lastChar) {
          const candidate = clean.slice(0, -1) + strippedLast;
          if (!this.STOPWORDS.has(candidate)) stems.add(candidate);
          if (candidate.endsWith('하') || candidate.endsWith('되')) {
            const root2 = candidate.slice(0, -1);
            if (root2.length >= 1 && !this.STOPWORDS.has(root2)) stems.add(root2);
          }
        }
      }

      if (clean.endsWith('롭') || clean.endsWith('답')) {
        const root = clean.slice(0, -1);
        if (root.length >= 1 && !this.STOPWORDS.has(root)) stems.add(root);
      }

      return Array.from(stems).filter(s => !this.STOPWORDS.has(s));
    },

    extractTokens(phraseStr, isTargetMeaning = false) {
      const norm = this.normalize(phraseStr, isTargetMeaning);
      if (!norm) return [];
      const words = norm.split(' ').filter(Boolean);
      const allTokens = new Set();

      for (const w of words) {
        if (!this.STOPWORDS.has(w)) {
          this.getStems(w).forEach(s => {
            if (!this.STOPWORDS.has(s)) allTokens.add(s);
          });
        }
      }

      return Array.from(allTokens);
    },

    extractSynonyms(synonymsStr) {
      if (!synonymsStr) return [];
      return synonymsStr
        .split(',')
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);
    },

    grade(wordItem, studentAnswer) {
      if (!studentAnswer || !studentAnswer.trim()) {
        return {
          isCorrect: false,
          score: 0,
          status: 'skipped',
          feedback: '답안이 입력되지 않았습니다. (스킵됨)',
          explanation: '답안이 비어 있어 점수가 부여되지 않았습니다.',
          refinedMeaning: (wordItem && wordItem.meaning) || '',
          matchedTokens: [],
          method: 'local',
          aiEvaluated: false
        };
      }

      if (!wordItem) {
        return {
          isCorrect: false,
          score: 0,
          status: 'incorrect',
          feedback: '단어 정보가 없습니다.',
          explanation: '단어 정보가 제공되지 않았습니다.',
          refinedMeaning: '',
          matchedTokens: [],
          method: 'local',
          aiEvaluated: false
        };
      }

      const rawInput = studentAnswer.trim();
      const normInput = this.normalize(rawInput);
      const inputNoSpaces = normInput.replace(/\s+/g, '');

      // 건너뛰기 / 포기 단어 명시적 감지
      const isSkipWord = ['모름', '모르다', '모르겠음', '모르겠습니다', '몰라', '몰라요', '패스', 'pass', 'skip'].includes(inputNoSpaces);
      if (isSkipWord) {
        return {
          isCorrect: false,
          score: 0,
          status: 'skipped',
          feedback: `문제를 건너뛰었습니다. 출제 정답: [${wordItem.meaning}]`,
          explanation: '정답 확인 후 오답 복습을 진행해주세요.',
          refinedMeaning: wordItem.meaning,
          matchedTokens: [],
          method: 'local',
          aiEvaluated: false
        };
      }

      // 불용어 또는 의미 없는 기호/자모 입력 방어
      if (!inputNoSpaces || this.STOPWORDS.has(inputNoSpaces)) {
        return {
          isCorrect: false,
          score: 0,
          status: 'incorrect',
          feedback: '유효한 실질 의미 단어가 입력되지 않았습니다. (보조용언/불용어 제외)',
          explanation: '보조용언(하다, 되다 등)이나 특수문자 외에 실질적인 뜻을 입력해주세요.',
          refinedMeaning: wordItem.meaning,
          matchedTokens: [],
          method: 'local',
          aiEvaluated: false
        };
      }

      // 1. 영문 기출 동의어 일치 검사 (단, 표제어 자체를 에코 치팅으로 그대로 입력한 경우는 제외)
      const synList = this.extractSynonyms(wordItem.synonyms);
      const rawLower = rawInput.toLowerCase();
      const targetWordLower = (wordItem.word || '').toLowerCase();

      if (rawLower !== targetWordLower && synList.includes(rawLower)) {
        return {
          isCorrect: true,
          score: 100,
          status: 'correct',
          feedback: `기출 핵심 동의어 '${rawInput}'(을)를 완벽하게 맞추셨습니다!`,
          explanation: `출제된 주요 유의어 '${wordItem.synonyms}'와 정확히 일치합니다.`,
          refinedMeaning: wordItem.meaning,
          matchedTokens: [rawInput],
          method: 'local',
          aiEvaluated: false
        };
      }

      // 2. 마스터 한국어 정답 어휘 및 어간 토큰 분석
      const targetTokens = this.extractTokens(wordItem.meaning, true);
      const inputTokens = this.extractTokens(rawInput);

      // 토큰 교집합 확인 (불용어 제외)
      const matched = [];
      for (const it of inputTokens) {
        if (!this.STOPWORDS.has(it) && targetTokens.includes(it) && it.length >= 1) {
          matched.push(it);
        }
      }

      // 정답 의미 문장에서 공백/특수문자 제거한 문자열
      const cleanTargetMeaning = wordItem.meaning
        .replace(/\([^)]*\)/g, '')
        .replace(/[.,·;:\s]/g, '');

      let score = 0;
      let feedback = '';
      let isCorrect = false;

      // [Case A] 완벽한 형태소/어간 일치 (100점)
      if (matched.length > 0) {
        score = 100;
        isCorrect = true;
        feedback = `핵심 어휘 '${matched.join(', ')}'이(가) 정답 의미와 정확히 일치합니다!`;
      }
      // [Case B] 학생 답안이 사전적 의미 구문에 직접 포함되거나 포함하는 경우 (90~95점)
      else if (cleanTargetMeaning.includes(inputNoSpaces) && inputNoSpaces.length >= 2 && !this.STOPWORDS.has(inputNoSpaces)) {
        score = 95;
        isCorrect = true;
        matched.push(inputNoSpaces);
        feedback = `'${inputNoSpaces}' 의미가 사전 표제어 뜻에 완벽히 부합합니다!`;
      }
      else if (inputNoSpaces.includes(cleanTargetMeaning) && cleanTargetMeaning.length >= 2 && !this.STOPWORDS.has(cleanTargetMeaning)) {
        score = 90;
        isCorrect = true;
        matched.push(cleanTargetMeaning);
        feedback = `정답 어휘 '${cleanTargetMeaning}'의 의미를 충실히 기술하셨습니다.`;
      }
      // [Case C] 길이 2 이상의 어간 토큰 부분 일치 (85점, 불용어 배제)
      else {
        for (const t of targetTokens) {
          if (!this.STOPWORDS.has(t) && t.length >= 2) {
            if (inputNoSpaces.includes(t) || (t.includes(inputNoSpaces) && inputNoSpaces.length >= 2)) {
              matched.push(t);
              score = 85;
              isCorrect = true;
              feedback = `핵심 개념 '${t}'(와)과 일치하여 정답으로 인정합니다.`;
              break;
            }
          }
        }
      }

      // [Case D] 과외쌤 팁(Tip)의 핵심 어휘와 대조 (출제자가 해설에 강조한 뉘앙스 매칭 - 80점)
      if (!isCorrect && wordItem.tip) {
        const tipTokens = this.extractTokens(wordItem.tip);
        for (const it of inputTokens) {
          if (!this.STOPWORDS.has(it) && it.length >= 2 && tipTokens.includes(it)) {
            matched.push(it);
            score = 80;
            isCorrect = true;
            feedback = `기출 출제 포인트 팁에 설명된 핵심 뉘앙스 '${it}'(을)를 정확히 파악하셨습니다!`;
            break;
          }
        }
      }

      // 오답 처리
      if (!isCorrect) {
        score = Math.min(score, 40);
        feedback = `아쉽습니다! 출제 정답: [${wordItem.meaning}]`;
      }

      return {
        isCorrect,
        score,
        status: isCorrect ? 'correct' : 'incorrect',
        feedback,
        explanation: feedback,
        refinedMeaning: wordItem.meaning,
        matchedTokens: matched,
        method: 'local',
        aiEvaluated: false
      };
    },

    gradeAnswer(arg1, arg2) {
      if (arg1 && typeof arg1 === 'object' && arg1.word && arg1.meaning) {
        return this.grade(arg1, arg2);
      } else {
        return this.grade(arg2, arg1);
      }
    }
  };

  // ============================================================================
  // [5] Cascading Retention State Engine (핵심 엔진 구현)
  // ============================================================================
  class CascadingStateEngine {
    constructor() {
      this.vocab = MASTER_VOCAB;
      this.vocabById = VOCAB_BY_ID;
      this.storage = storage;
      this.matcher = SmartKoreanMatcher;
      this.state = this._loadInitialState();
    }

    /**
     * 초기 상태를 로드하거나 새로 생성합니다.
     */
    _loadInitialState() {
      const loaded = this.storage.get();
      if (loaded && loaded.version === 1 && Array.isArray(loaded.unmasteredWrongPool)) {
        if (!loaded.dailyRecords) loaded.dailyRecords = {};
        if (!Array.isArray(loaded.completedDays)) loaded.completedDays = [];
        return loaded;
      }
      return this._createNewState();
    }

    _createNewState() {
      return {
        version: 1,
        lastUpdated: Date.now(),
        unmasteredWrongPool: [], // [wordId1, wordId2, ...]
        completedDays: [],       // [1, 2, ...]
        dailyRecords: {},        // { '1': { ... }, '2': { ... } }
        activeSession: null      // 진행 중인 퀴즈 세션 객체
      };
    }

    _saveState() {
      this.state.lastUpdated = Date.now();
      this.storage.set(this.state);
    }

    /**
     * 특정 ID의 단어 객체를 조회합니다.
     */
    getWordById(id) {
      const numId = parseInt(id, 10);
      return this.vocabById.get(numId) || null;
    }

    /**
     * 전체 마스터 보카 리스트(405제)를 반환합니다.
     */
    getMasterVocab() {
      return this.vocab;
    }

    /**
     * 특정 Day(1~10)의 기본 진도 단어 리스트(40 또는 45제)를 반환합니다.
     */
    getWordsForDay(day) {
      const range = getPartitionRange(day);
      return this.vocab.slice(range.start, range.end);
    }

    /**
     * 현재 누적 미정복 풀(unmasteredWrongPool)에 있는 단어들의 객체 배열을 반환합니다.
     */
    getUnmasteredPool() {
      return this.state.unmasteredWrongPool
        .map(id => this.getWordById(id))
        .filter(Boolean);
    }

    /**
     * 현재 활성화된 세션 정보를 반환합니다.
     */
    getActiveSession() {
      return this.state.activeSession;
    }

    // ==========================================================================
    // [6] 핵심 공개 API 구현
    // ==========================================================================

    /**
     * 1. startDayQuiz(day, options)
     * Day N 퀴즈 세션을 시작합니다.
     *  - Base: 당일 진도 단어 (42문항 균등 분할)
     *  - Cascading: 이전 Day들에서 누적된 unmasteredWrongPool 단어들을 합산!
     *  - 누적 복습 문항에는 isCarriedOver: true 및 tag: "[누적 복습 🔄]" 부여!
     */
    startDayQuiz(day, options = {}) {
      const d = parseInt(day, 10);
      const range = getPartitionRange(d);

      // 이미 진행 중인 동일 Day 세션이 있고 forceRestart가 아닌 경우 복원
      if (
        !options.forceRestart &&
        this.state.activeSession &&
        this.state.activeSession.day === d &&
        this.state.activeSession.type === 'daily' &&
        !this.state.activeSession.isCompleted
      ) {
        return this.state.activeSession;
      }

      // 1) 당일 기본 신규 진도 단어
      const baseWords = this.vocab.slice(range.start, range.end).map(word => ({
        ...word,
        isCarriedOver: false,
        tag: `[Day ${d} 신규]`,
        badge: ''
      }));

      const baseIds = new Set(baseWords.map(w => w.id));

      // 2) 이전 누적 미정복 풀에서 이월된 단어 (중복 방지)
      const carriedOverWords = this.state.unmasteredWrongPool
        .filter(id => !baseIds.has(id))
        .map(id => {
          const item = this.getWordById(id);
          if (!item) return null;
          return {
            ...item,
            isCarriedOver: true,
            tag: '[누적 복습 🔄]',
            badge: '[누적 복습 🔄]'
          };
        })
        .filter(Boolean);

      // 3) 문항 배치 순서 (기본값: 에빙하우스 망각곡선 및 안키 원칙에 따라 복습 우선 reviewFirst)
      let questions = [];
      const order = options.order || 'reviewFirst';
      if (order === 'newFirst') {
        questions = [...baseWords, ...carriedOverWords];
      } else if (order === 'shuffled') {
        questions = [...carriedOverWords, ...baseWords].sort(() => Math.random() - 0.5);
      } else {
        // 'reviewFirst'
        questions = [...carriedOverWords, ...baseWords];
      }

      const session = {
        sessionId: `day_${d}_${Date.now()}`,
        type: 'daily',
        day: d,
        questions: questions,
        totalCount: questions.length,
        baseCount: baseWords.length,
        carriedOverCount: carriedOverWords.length,
        currentIndex: 0,
        answers: {},
        isCompleted: false,
        startTime: Date.now(),
        completedAt: null,
        score: 0,
        correctCount: 0,
        wrongCount: 0
      };

      this.state.activeSession = session;
      this._saveState();
      return session;
    }

    /**
     * 2. submitAnswer(wordId, text, options)
     * 학생이 입력한 한국어(또는 영문 동의어) 답안을 스마트 채점하고 세션 상태를 갱신합니다.
     * 모든 문항 완료 시 자동으로 누적 풀 갱신 및 Day N 완료 기록을 확정합니다.
     */
    submitAnswer(wordId, text, options = {}) {
      const numId = parseInt(wordId, 10);
      const session = this.state.activeSession;

      if (!session) {
        throw new Error('[CascadingEngine] 활성화된 퀴즈 세션이 없습니다. startDayQuiz()를 먼저 호출하세요.');
      }

      // 현재 세션의 해당 단어 문항 검색
      const question = session.questions.find(q => q.id === numId);
      if (!question) {
        throw new Error(`[CascadingEngine] 현재 세션에 ID ${numId}인 단어가 존재하지 않습니다.`);
      }

      // SmartKoreanMatcher 로컬 채점 실행
      const gradeResult = this.matcher.grade(question, text);

      // 세션 답안 기록
      const answerRecord = {
        wordId: numId,
        word: question.word,
        studentAnswer: text,
        userAnswer: text,
        isCorrect: gradeResult.isCorrect,
        score: gradeResult.score,
        status: gradeResult.status,
        feedback: gradeResult.feedback,
        explanation: gradeResult.explanation,
        refinedMeaning: question.meaning,
        matchedTokens: gradeResult.matchedTokens,
        isCarriedOver: !!question.isCarriedOver,
        timestamp: Date.now()
      };

      session.answers[numId] = answerRecord;

      // 점수 및 정답 개수 실시간 재집계
      let correct = 0;
      let wrong = 0;
      let totalScoreAcc = 0;
      const answeredKeys = Object.keys(session.answers);

      answeredKeys.forEach(k => {
        const ans = session.answers[k];
        if (ans.isCorrect) {
          correct++;
        } else {
          wrong++;
        }
        totalScoreAcc += ans.score;
      });

      session.correctCount = correct;
      session.wrongCount = wrong;
      session.score = session.totalCount > 0 ? Math.round((correct / session.totalCount) * 100) : 0;

      // 다음 미응시 문항 인덱스로 커서 전진
      const nextIdx = session.questions.findIndex(q => !session.answers[q.id]);
      if (nextIdx !== -1) {
        session.currentIndex = nextIdx;
      } else {
        session.currentIndex = session.questions.length;
      }

      // 모든 문항이 답변되었거나 명시적 자동 완료 옵션인 경우
      let completionSummary = null;
      if (answeredKeys.length >= session.totalCount || options.finalize === true) {
        completionSummary = this._finalizeQuizSession(session);
      } else {
        this._saveState();
      }

      return {
        answerResult: answerRecord,
        session: {
          sessionId: session.sessionId,
          day: session.day,
          type: session.type,
          currentIndex: session.currentIndex,
          answeredCount: answeredKeys.length,
          totalCount: session.totalCount,
          correctCount: session.correctCount,
          wrongCount: session.wrongCount,
          score: session.score,
          isCompleted: session.isCompleted,
          unmasteredPoolCount: this.state.unmasteredWrongPool.length
        },
        completionSummary
      };
    }

    /**
     * 세션을 완료 처리하고 핵심 폭포수 누적 복습 풀(unmasteredWrongPool)을 갱신합니다.
     */
    _finalizeQuizSession(session) {
      session.isCompleted = true;
      session.completedAt = Date.now();

      // 전체 문항 정답/오답/점수 완전 재집계
      let correct = 0;
      let wrong = 0;
      session.questions.forEach(q => {
        const ans = session.answers[q.id];
        if (ans && ans.isCorrect) {
          correct++;
        } else {
          wrong++;
        }
      });
      session.correctCount = correct;
      session.wrongCount = wrong;
      session.score = session.totalCount > 0 ? Math.round((correct / session.totalCount) * 100) : 0;

      // 일반 Daily 퀴즈 세션의 폭포수 누적 풀 갱신 알고리즘
      if (session.type === 'daily') {
        const day = session.day;
        const currentPoolSet = new Set(this.state.unmasteredWrongPool);

        let carriedOverMastered = 0;
        let carriedOverFailed = 0;
        let newWordsFailed = 0;
        let newWordsMastered = 0;

        const wrongWordIds = [];
        const masteredWordIds = [];

        session.questions.forEach(q => {
          const ans = session.answers[q.id];
          const isCorrect = ans && ans.isCorrect;

          if (isCorrect) {
            masteredWordIds.push(q.id);
          } else {
            wrongWordIds.push(q.id);
          }

          if (q.isCarriedOver) {
            // [규칙 A] 이월 단어를 맞춤 -> unmasteredWrongPool에서 즉시 영구 삭제 (Mastered!)
            if (isCorrect) {
              currentPoolSet.delete(q.id);
              carriedOverMastered++;
            } else {
              // [규칙 B] 이월 단어를 또 틀림 -> unmasteredWrongPool에 그대로 잔류!
              currentPoolSet.add(q.id);
              carriedOverFailed++;
            }
          } else {
            // [규칙 C] 당일 신규 단어를 틀림 -> unmasteredWrongPool에 새롭게 추가!
            if (!isCorrect) {
              currentPoolSet.add(q.id);
              newWordsFailed++;
            } else {
              newWordsMastered++;
            }
          }
        });

        // 풀 갱신 및 정렬(ID 오름차순 유지)
        this.state.unmasteredWrongPool = Array.from(currentPoolSet).sort((a, b) => a - b);

        // 완료된 일차 목록에 추가
        if (!this.state.completedDays.includes(day)) {
          this.state.completedDays.push(day);
          this.state.completedDays.sort((a, b) => a - b);
        }

        // Day별 종합 결과 기록
        const dayRecord = {
          day,
          completed: true,
          completedAt: new Date(session.completedAt).toISOString(),
          totalQuestions: session.totalCount,
          correctCount: session.correctCount,
          wrongCount: session.wrongCount,
          score: session.score,
          carriedOverTotal: session.carriedOverCount,
          carriedOverMastered,
          carriedOverFailed,
          newWordsTotal: session.baseCount,
          newWordsMastered,
          newWordsFailed,
          answers: { ...session.answers },
          wrongWordIds,
          masteredWordIds,
          retests: []
        };

        this.state.dailyRecords[day] = dayRecord;

        const summary = {
          day,
          completedAt: dayRecord.completedAt,
          score: session.score,
          totalQuestions: session.totalCount,
          correctCount: session.correctCount,
          wrongCount: session.wrongCount,
          carriedOverTotal: session.carriedOverCount,
          carriedOverMastered,
          carriedOverFailed,
          newWordsTotal: session.baseCount,
          newWordsMastered,
          newWordsFailed,
          wrongWordIds,
          unmasteredPoolCount: this.state.unmasteredWrongPool.length,
          activeUnmasteredIds: [...this.state.unmasteredWrongPool]
        };

        session.completionSummary = summary;
        this._saveState();
        return summary;
      }

      // 오답 재시험(retest) 세션의 완료 처리
      if (session.type === 'retest') {
        const day = session.day;
        const retestWrongIds = session.questions
          .filter(q => !session.answers[q.id] || !session.answers[q.id].isCorrect)
          .map(q => q.id);

        const retestMasteredIds = session.questions
          .filter(q => session.answers[q.id] && session.answers[q.id].isCorrect)
          .map(q => q.id);

        // 옵션에 따라 재시험 정답 단어를 누적 풀에서도 제거할 수 있도록 지원
        if (session.options && session.options.resolveInPool === true) {
          const poolSet = new Set(this.state.unmasteredWrongPool);
          retestMasteredIds.forEach(id => poolSet.delete(id));
          this.state.unmasteredWrongPool = Array.from(poolSet).sort((a, b) => a - b);
        }

        const retestSummary = {
          type: 'retest',
          day,
          completedAt: new Date(session.completedAt).toISOString(),
          total: session.totalCount,
          correctCount: session.correctCount,
          wrongCount: session.wrongCount,
          score: session.score,
          retestWrongIds,
          retestMasteredIds,
          unmasteredPoolCount: this.state.unmasteredWrongPool.length
        };

        if (this.state.dailyRecords[day]) {
          if (!this.state.dailyRecords[day].retests) {
            this.state.dailyRecords[day].retests = [];
          }
          this.state.dailyRecords[day].retests.push(retestSummary);
        }

        session.completionSummary = retestSummary;
        this._saveState();
        return retestSummary;
      }

      this._saveState();
      return null;
    }

    /**
     * 현재 Day 퀴즈 세션을 명시적으로 강제 완료합니다.
     * (아직 답안을 작성하지 않은 문항은 자동 오답/스킵 처리)
     */
    completeDayQuiz(day) {
      const session = this.state.activeSession;
      if (!session) {
        throw new Error('[CascadingEngine] 완료할 활성 세션이 없습니다.');
      }

      // 미제출 문항 스킵 처리
      session.questions.forEach(q => {
        if (!session.answers[q.id]) {
          session.answers[q.id] = {
            wordId: q.id,
            word: q.word,
            studentAnswer: '',
            isCorrect: false,
            score: 0,
            status: 'skipped',
            feedback: `미입력 상태로 시험이 종료되었습니다. 출제 정답: [${q.meaning}]`,
            explanation: '미제출로 오답 처리되었습니다.',
            refinedMeaning: q.meaning,
            matchedTokens: [],
            isCarriedOver: !!q.isCarriedOver,
            timestamp: Date.now()
          };
        }
      });

      return this._finalizeQuizSession(session);
    }

    /**
     * 3. startRetestQuiz(day, options)
     * 방금 완료한 시험의 오답들만 즉각 모아서 재시험 세션을 생성합니다.
     */
    startRetestQuiz(day, options = {}) {
      const d = parseInt(day, 10);
      const record = this.state.dailyRecords[d];

      let wrongIds = [];
      if (record && Array.isArray(record.wrongWordIds)) {
        wrongIds = record.wrongWordIds;
      } else if (
        this.state.activeSession &&
        this.state.activeSession.day === d &&
        this.state.activeSession.answers
      ) {
        wrongIds = Object.values(this.state.activeSession.answers)
          .filter(a => !a.isCorrect)
          .map(a => a.wordId);
      }

      if (!wrongIds || wrongIds.length === 0) {
        return {
          retestAvailable: false,
          day: d,
          message: '축하합니다! 오답이 없거나 재시험 대상 단어가 없습니다. 완벽합니다! 🎉',
          questions: []
        };
      }

      const questions = wrongIds.map(id => {
        const word = this.getWordById(id);
        return {
          ...word,
          isRetest: true,
          tag: '[오답 재시험 ⚡]',
          badge: '[오답 재시험 ⚡]'
        };
      }).filter(Boolean);

      const retestSession = {
        sessionId: `retest_${d}_${Date.now()}`,
        type: 'retest',
        day: d,
        questions,
        totalCount: questions.length,
        currentIndex: 0,
        answers: {},
        isCompleted: false,
        startTime: Date.now(),
        completedAt: null,
        score: 0,
        correctCount: 0,
        wrongCount: 0,
        options: options || {}
      };

      this.state.activeSession = retestSession;
      this._saveState();
      return retestSession;
    }

    /**
     * 4. getFlashcards(day, options)
     * Day N의 단어장 플래시카드 목록을 반환합니다.
     * 기본적으로 Day N의 신규 42제와, 이전 Day에서 누적된 미정복 단어들을 함께 반환합니다.
     */
    getFlashcards(day, options = {}) {
      const d = parseInt(day, 10);
      const range = getPartitionRange(d);

      // 당일 표제어
      const baseCards = this.vocab.slice(range.start, range.end).map(word => {
        const isUnmastered = this.state.unmasteredWrongPool.includes(word.id);
        return {
          ...word,
          day: d,
          isCarriedOver: false,
          tag: `[Day ${d} 신규]`,
          badge: '',
          status: isUnmastered ? 'unmastered' : 'normal'
        };
      });

      // 누적 미정복 단어 카드
      const baseIds = new Set(baseCards.map(c => c.id));
      const unmasteredCards = this.state.unmasteredWrongPool
        .filter(id => !baseIds.has(id))
        .map(id => {
          const item = this.getWordById(id);
          if (!item) return null;
          return {
            ...item,
            day: d,
            isCarriedOver: true,
            tag: '[누적 복습 🔄]',
            badge: '[누적 복습 🔄]',
            status: 'unmastered'
          };
        })
        .filter(Boolean);

      let allCards = [];
      if (options.includeUnmastered !== false) {
        allCards = [...unmasteredCards, ...baseCards];
      } else {
        allCards = [...baseCards];
      }

      // 배열에 직관적 메타데이터 속성 바인딩
      allCards.day = d;
      allCards.baseCount = baseCards.length;
      allCards.carriedOverCount = unmasteredCards.length;
      allCards.unmasteredCount = allCards.filter(c => c.status === 'unmastered').length;
      allCards.totalCount = allCards.length;
      allCards.baseCards = baseCards;
      allCards.carriedOverCards = unmasteredCards;
      allCards.unmasteredCards = allCards.filter(c => c.status === 'unmastered');

      return allCards;
    }

    /**
     * 5. getDailyStatus(day)
     * 특정 Day의 진행 상태 또는 전체 10일의 통합 학습 대시보드 상태를 반환합니다.
     */
    getDailyStatus(day = null) {
      if (day !== null && day !== undefined) {
        const d = parseInt(day, 10);
        const range = getPartitionRange(d);
        const record = this.state.dailyRecords[d] || null;
        const isCompleted = this.state.completedDays.includes(d);
        const isUnlocked = d === 1 || this.state.completedDays.includes(d - 1);

        const wrongWordIds = record ? (record.wrongWordIds || []) : [];
        const wrongWords = wrongWordIds.map(id => this.getWordById(id)).filter(Boolean);

        return {
          day: d,
          isUnlocked,
          isCompleted,
          score: record ? record.score : null,
          totalQuestions: record ? record.totalQuestions : (range.count + (d > 1 ? this.state.unmasteredWrongPool.length : 0)),
          correctCount: record ? record.correctCount : 0,
          wrongCount: record ? record.wrongCount : 0,
          carriedOverCount: record ? record.carriedOverTotal : (d > 1 ? this.state.unmasteredWrongPool.length : 0),
          carriedOverMastered: record ? record.carriedOverMastered : 0,
          carriedOverFailed: record ? record.carriedOverFailed : 0,
          newWordsCount: range.count,
          newWordsMastered: record ? record.newWordsMastered : 0,
          newWordsFailed: record ? record.newWordsFailed : 0,
          completedAt: record ? record.completedAt : null,
          wrongWordIds,
          wrongWords,
          retestAvailable: wrongWordIds.length > 0,
          retestsCount: record && record.retests ? record.retests.length : 0,
          latestRetestScore: record && record.retests && record.retests.length > 0
            ? record.retests[record.retests.length - 1].score
            : null
        };
      }

      // Day가 지정되지 않은 경우: 전체 10일 대시보드 통합 상태 반환
      const daysStatus = [];
      for (let i = 1; i <= 10; i++) {
        daysStatus.push(this.getDailyStatus(i));
      }

      const totalVocabCount = this.vocab.length;
      const completedDaysCount = this.state.completedDays.length;
      const unmasteredPoolCount = this.state.unmasteredWrongPool.length;

      // 전체 마스터율 계산: (완료된 신규 단어 - 현재 미정복 단어) / 405
      let totalTestedNewWords = 0;
      this.state.completedDays.forEach(d => {
        totalTestedNewWords += DAY_PARTITIONS[d].count;
      });

      const totalMasteredWords = Math.max(0, totalTestedNewWords - unmasteredPoolCount);
      const overallMasteryRate = totalTestedNewWords > 0
        ? Math.round((totalMasteredWords / totalTestedNewWords) * 100)
        : 0;

      return {
        days: daysStatus,
        totalVocabCount,
        completedDaysCount,
        unmasteredPoolCount,
        unmasteredWordIds: [...this.state.unmasteredWrongPool],
        unmasteredWords: this.getUnmasteredPool(),
        totalTestedNewWords,
        totalMasteredWords,
        overallMasteryRate,
        isAllCompleted: completedDaysCount === 10
      };
    }

    /**
     * 6. resetAllProgress()
     * 모든 학습 진도, 오답 누적 풀, 일차별 기록을 초기화합니다.
     */
    resetAllProgress() {
      this.storage.remove();
      this.state = this._createNewState();
      this._saveState();
      return {
        success: true,
        message: '모든 학습 진행 내역과 누적 오답 풀이 초기화되었습니다.',
        state: this.state
      };
    }

    /**
     * 상태 내보내기 (Export JSON)
     */
    exportState() {
      return JSON.stringify(this.state, null, 2);
    }

    /**
     * 상태 가져오기 (Import JSON)
     */
    importState(jsonOrObj) {
      try {
        const parsed = typeof jsonOrObj === 'string' ? JSON.parse(jsonOrObj) : jsonOrObj;
        if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.unmasteredWrongPool)) {
          throw new Error('유효하지 않은 상태 형식입니다.');
        }
        this.state = parsed;
        this._saveState();
        return { success: true, state: this.state };
      } catch (e) {
        return { success: false, error: e.message };
      }
    }
  }

  // 싱글톤 인스턴스 생성
  const defaultInstance = new CascadingStateEngine();

  // 클래스 정의 및 싱글톤 메서드 복합 export
  defaultInstance.CascadingStateEngine = CascadingStateEngine;
  defaultInstance.SmartKoreanMatcher = SmartKoreanMatcher;
  defaultInstance.MASTER_VOCAB = MASTER_VOCAB;
  defaultInstance.DAY_PARTITIONS = DAY_PARTITIONS;
  defaultInstance.STORAGE_KEY = STORAGE_KEY;

  return defaultInstance;
}));

  function injectStyles() {
    if (typeof document === 'undefined' || !document.head) return;
    if (document.getElementById('c-ux-styles')) return;
    const styleEl = document.createElement('style');
    styleEl.id = 'c-ux-styles';
    styleEl.textContent = STYLES;
    document.head.appendChild(styleEl);
  }

  function getUnivBadgeClass(univStr) {
    if (!univStr) return 'c-ux-univ-multi';
    if (univStr.includes('서강대') && univStr.includes('성균관대')) return 'c-ux-univ-multi';
    if (univStr.includes('서강대') && univStr.includes('한양대')) return 'c-ux-univ-multi';
    if (univStr.includes('성균관대') && univStr.includes('한양대')) return 'c-ux-univ-multi';
    if (univStr.includes('서강대')) return 'c-ux-univ-sogang';
    if (univStr.includes('성균관대')) return 'c-ux-univ-skku';
    if (univStr.includes('한양대')) return 'c-ux-univ-hanyang';
    return 'c-ux-univ-multi';
  }

  function highlightWordInSentence(sentence, word) {
    if (!sentence || !word) return sentence || '';
    const cleanWord = word.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`\\b(${cleanWord}[a-z]*)\\b`, 'gi');
    return sentence.replace(regex, '<span class="c-ux-highlight">$1</span>');
  }

  // [3] CascadingMobileUX 클래스 정의
  // ----------------------------------------------------------------------------
  class CascadingMobileUX {
    constructor(options = {}) {
      this.options = Object.assign({
        container: '#app',
        vocabData: [],
        daySchedule: null,
        cascadingEngine: null,
        initialDay: 1,
        initialMode: 'flashcard', // 'flashcard' | 'test'
        autoRevealMeaning: false,
        storageKey: 'cascading_vocab_progress_v2',
        onDayChange: null,
        onModeChange: null,
        onStartTest: null,
        onProgressUpdate: null,
        onWordMastered: null
      }, options);

      // DOM Container Resolving
      if (typeof this.options.container === 'string') {
        this.container = (typeof document !== 'undefined' && typeof document.querySelector === 'function') 
          ? document.querySelector(this.options.container) 
          : null;
      } else {
        this.container = this.options.container;
      }

      if (!this.container && typeof document !== 'undefined' && typeof document.createElement === 'function') {
        this.container = document.createElement('div');
        this.container.id = 'cascading-mobile-app';
        if (document.body && typeof document.body.appendChild === 'function') {
          document.body.appendChild(this.container);
        }
      }

      // State
      this.currentDay = this.options.initialDay || 1;
      this.currentMode = this.options.initialMode || 'flashcard';
      this.currentIndex = 0;
      this.meaningVisible = !!this.options.autoRevealMeaning;
      this.autoRevealMeaning = !!this.options.autoRevealMeaning;
      this.isShuffled = false;
      this.filterUnmasteredOnly = false;
      this.masteredMap = {}; // { [wordId]: true }

      // Touch gesture coordinates
      this.touchStartX = 0;
      this.touchStartY = 0;
      this.touchEndX = 0;
      this.touchEndY = 0;

      // Bound Event Handlers for Cleanup
      this._boundKeyHandler = this._handleKeyDown.bind(this);

      // Initialize
      injectStyles();
      this._loadStorageState();
      this.initSchedule();
      this.render();
      this._attachGlobalListeners();
    }

    // --------------------------------------------------------------------------
    // [3.1] 로컬 스토리지 상태 동기화
    // --------------------------------------------------------------------------
    _loadStorageState() {
      try {
        if (typeof localStorage === 'undefined') return;
        const saved = localStorage.getItem(this.options.storageKey);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.masteredMap) this.masteredMap = parsed.masteredMap;
          if (parsed.currentDay && !this.options.initialDaySpecified) {
            this.currentDay = parsed.currentDay;
          }
          if (typeof parsed.autoRevealMeaning === 'boolean') {
            this.autoRevealMeaning = parsed.autoRevealMeaning;
            this.meaningVisible = this.autoRevealMeaning;
          }
        }
      } catch (err) {
        console.warn('[CascadingMobileUX] LocalStorage read warning:', err);
      }
    }

    _saveStorageState() {
      try {
        if (typeof localStorage === 'undefined') return;
        const payload = {
          masteredMap: this.masteredMap,
          currentDay: this.currentDay,
          autoRevealMeaning: this.autoRevealMeaning,
          lastUpdated: Date.now()
        };
        localStorage.setItem(this.options.storageKey, JSON.stringify(payload));
      } catch (err) {
        console.warn('[CascadingMobileUX] LocalStorage write warning:', err);
      }
    }

    // --------------------------------------------------------------------------
    // [3.2] 10일 완성 캐스케이딩 스케줄 구성 및 엔진 연동
    // --------------------------------------------------------------------------
    initSchedule() {
      // 0. 외부 cascadingEngine 인스턴스가 옵션으로 전달된 경우 우선 적용
      if (this.options.cascadingEngine && typeof this.options.cascadingEngine.getFlashcards === 'function') {
        this.cascadingEngine = this.options.cascadingEngine;
        return;
      }
      // 1. 외부 daySchedule이 주어진 경우 적용
      if (this.options.daySchedule && typeof this.options.daySchedule === 'object') {
        this.schedule = this.options.daySchedule;
        return;
      }

      // 2. CascadingEngine (cascading_state_engine.js) 글로벌 감지
      if (typeof window !== 'undefined' && window.CascadingEngine && typeof window.CascadingEngine.getFlashcards === 'function') {
        this.cascadingEngine = window.CascadingEngine;
        return;
      }

      // 3. vocabData 확인 (옵션 또는 window.VOCAB_DATA 폴백)
      let data = this.options.vocabData;
      if ((!data || data.length === 0) && typeof window !== 'undefined' && window.VOCAB_DATA) {
        data = window.VOCAB_DATA;
      }
      this.vocabData = Array.isArray(data) ? data : [];

      // 4. 10일 기본 캐스케이딩 자동 파티션 (총 420단어 균등 분할: 일차당 42문항)
      this.schedule = {};
      const totalWords = this.vocabData.length;
      const basePerDay = totalWords > 0 ? Math.ceil(totalWords / 10) : 40;

      for (let day = 1; day <= 10; day++) {
        const start = (day - 1) * basePerDay;
        const end = (day === 10) ? totalWords : Math.min(start + basePerDay, totalWords);
        const dayWords = this.vocabData.slice(start, end).map(item => Object.assign({}, item, {
          dayNum: day
        }));
        this.schedule[day] = dayWords;
      }
    }

    getDayWords(day) {
      if (this.cascadingEngine && typeof this.cascadingEngine.getFlashcards === 'function') {
        return this.cascadingEngine.getFlashcards(day);
      }
      if (!this.schedule) this.initSchedule();
      const list = this.schedule[day] || [];
      return Array.isArray(list) ? list : (list.allWords || list.words || []);
    }

    getActiveDeck() {
      let words = this.getDayWords(this.currentDay).slice();
      if (this.filterUnmasteredOnly) {
        words = words.filter(w => !this.masteredMap[w.id]);
      }
      if (this.isShuffled && this._shuffledList && this._shuffledList.length === words.length) {
        return this._shuffledList;
      }
      return words;
    }

    getCurrentWord() {
      const deck = this.getActiveDeck();
      if (deck.length === 0) return null;
      if (this.currentIndex >= deck.length) {
        this.currentIndex = 0;
      }
      return deck[this.currentIndex];
    }

    // --------------------------------------------------------------------------
    // [3.3] 진도율 계산
    // --------------------------------------------------------------------------
    getDayProgress(day) {
      const allWords = this.getDayWords(day);
      const total = allWords.length;
      if (total === 0) return { total: 0, mastered: 0, percent: 0, isCompleted: false };
      
      const mastered = allWords.filter(w => !!this.masteredMap[w.id]).length;
      const percent = Math.round((mastered / total) * 100);

      // Check if CascadingEngine reports test completion
      let isTestCompleted = false;
      if (this.cascadingEngine && typeof this.cascadingEngine.getDailyStatus === 'function') {
        const status = this.cascadingEngine.getDailyStatus(day);
        if (status && status.isCompleted) isTestCompleted = true;
      }

      return {
        total,
        mastered,
        percent,
        isCompleted: isTestCompleted || (mastered === total && total > 0)
      };
    }

    // --------------------------------------------------------------------------
    // [3.4] 네비게이션 & 제스처 액션
    // --------------------------------------------------------------------------
    selectDay(day) {
      const d = parseInt(day, 10);
      if (isNaN(d) || d < 1 || d > 10) return;
      this.currentDay = d;
      this.currentIndex = 0;
      this.isShuffled = false;
      this._shuffledList = null;
      this.meaningVisible = this.autoRevealMeaning;
      this._saveStorageState();
      this.render();

      if (typeof this.options.onDayChange === 'function') {
        this.options.onDayChange(this.currentDay, this.getDayWords(this.currentDay));
      }
      this._scrollActiveDayIntoView();
    }

    setMode(mode) {
      if (mode !== 'flashcard' && mode !== 'test') return;
      this.currentMode = mode;
      this.render();

      if (typeof this.options.onModeChange === 'function') {
        this.options.onModeChange(this.currentMode, this.currentDay);
      }
    }

    nextCard() {
      const deck = this.getActiveDeck();
      if (deck.length <= 1) return;
      this.currentIndex = (this.currentIndex + 1) % deck.length;
      this.meaningVisible = this.autoRevealMeaning;
      this._updateCardUI();
    }

    prevCard() {
      const deck = this.getActiveDeck();
      if (deck.length <= 1) return;
      this.currentIndex = (this.currentIndex - 1 + deck.length) % deck.length;
      this.meaningVisible = this.autoRevealMeaning;
      this._updateCardUI();
    }

    goToCard(index) {
      const deck = this.getActiveDeck();
      if (index >= 0 && index < deck.length) {
        this.currentIndex = index;
        this.meaningVisible = this.autoRevealMeaning;
        this._updateCardUI();
      }
    }

    toggleMeaning(forceState) {
      if (typeof forceState === 'boolean') {
        this.meaningVisible = forceState;
      } else {
        this.meaningVisible = !this.meaningVisible;
      }
      this._updateMeaningUI();
    }

    toggleAutoReveal() {
      this.autoRevealMeaning = !this.autoRevealMeaning;
      this.meaningVisible = this.autoRevealMeaning;
      this._saveStorageState();
      this.render();
    }

    toggleShuffle() {
      const deck = this.getActiveDeck();
      if (this.isShuffled) {
        this.isShuffled = false;
        this._shuffledList = null;
        this.currentIndex = 0;
      } else {
        this.isShuffled = true;
        // Fisher-Yates shuffle
        const copy = deck.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        this._shuffledList = copy;
        this.currentIndex = 0;
      }
      this.meaningVisible = this.autoRevealMeaning;
      this.render();
    }

    toggleFilterUnmastered() {
      this.filterUnmasteredOnly = !this.filterUnmasteredOnly;
      this.currentIndex = 0;
      this.isShuffled = false;
      this._shuffledList = null;
      this.meaningVisible = this.autoRevealMeaning;
      this.render();
    }

    toggleMasteredCurrent() {
      const word = this.getCurrentWord();
      if (!word) return;
      const isCurrently = !!this.masteredMap[word.id];
      if (isCurrently) {
        delete this.masteredMap[word.id];
      } else {
        this.masteredMap[word.id] = true;
      }
      this._saveStorageState();

      if (typeof this.options.onWordMastered === 'function') {
        this.options.onWordMastered(word.id, !isCurrently, this.getDayProgress(this.currentDay));
      }
      if (typeof this.options.onProgressUpdate === 'function') {
        this.options.onProgressUpdate(this.currentDay, this.getDayProgress(this.currentDay));
      }

      this.render();
    }

    speakCurrentWord() {
      const word = this.getCurrentWord();
      if (!word || !word.word) return;
      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(word.word);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        } catch (err) {
          console.warn('[CascadingMobileUX] TTS warning:', err);
        }
      }
    }

    startTest() {
      if (typeof this.options.onStartTest === 'function') {
        this.options.onStartTest(this.currentDay, this.getDayWords(this.currentDay));
      } else {
        if (this.cascadingEngine && typeof this.cascadingEngine.startDayQuiz === 'function') {
          this.cascadingEngine.startDayQuiz(this.currentDay);
        }
        this.setMode('test');
      }
    }

    // --------------------------------------------------------------------------
    // [3.5] 키보드 & 터치 제스처 핸들러 (SSR Safe)
    // --------------------------------------------------------------------------
    _attachGlobalListeners() {
      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        if (typeof window.removeEventListener === 'function') {
          window.removeEventListener('keydown', this._boundKeyHandler);
        }
        window.addEventListener('keydown', this._boundKeyHandler);
      }
    }

    _handleKeyDown(e) {
      if (this.currentMode !== 'flashcard') return;
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      if (e.key === 'ArrowRight') {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        this.nextCard();
      } else if (e.key === 'ArrowLeft') {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        this.prevCard();
      } else if (e.key === ' ' || e.code === 'Space') {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        this.toggleMeaning();
      } else if (e.key === 's' || e.key === 'S') {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        this.speakCurrentWord();
      } else if (e.key === 'm' || e.key === 'M') {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        this.toggleMasteredCurrent();
      }
    }

    _attachSwipeGestures(cardEl) {
      if (!cardEl || typeof cardEl.addEventListener !== 'function') return;
      cardEl.addEventListener('touchstart', (e) => {
        if (!e.changedTouches || e.changedTouches.length === 0) return;
        this.touchStartX = e.changedTouches[0].clientX;
        this.touchStartY = e.changedTouches[0].clientY;
      }, { passive: true });

      cardEl.addEventListener('touchend', (e) => {
        if (!e.changedTouches || e.changedTouches.length === 0) return;
        this.touchEndX = e.changedTouches[0].clientX;
        this.touchEndY = e.changedTouches[0].clientY;
        this._handleSwipe();
      }, { passive: true });
    }

    _handleSwipe() {
      const deltaX = this.touchEndX - this.touchStartX;
      const deltaY = this.touchEndY - this.touchStartY;
      const absDeltaX = Math.abs(deltaX);
      const absDeltaY = Math.abs(deltaY);

      if (absDeltaX > 45 && absDeltaX > 1.25 * absDeltaY) {
        if (deltaX < 0) {
          this.nextCard();
        } else {
          this.prevCard();
        }
      }
    }

    _scrollActiveDayIntoView() {
      if (!this.container || typeof this.container.querySelector !== 'function') return;
      const activePill = this.container.querySelector(`.c-ux-day-pill[data-day="${this.currentDay}"]`);
      if (activePill && typeof activePill.scrollIntoView === 'function') {
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    // --------------------------------------------------------------------------
    // [3.6] 렌더링 파이프라인 (Mobile-First Modular Layout)
    // --------------------------------------------------------------------------
    render() {
      if (!this.container) return;
      this.container.innerHTML = `
        <div class="c-ux-container">
          <!-- 1. Header & Brand -->
          <header class="c-ux-header">
            <div class="c-ux-brand">
              <div>
                <h1 class="c-ux-brand-title">10일 완성 서·성·한 편입 VOCA</h1>
                <p class="c-ux-brand-subtitle">서강대 · 성균관대 · 한양대 최신 3개년 405제 캐스케이딩 마스터</p>
              </div>
              <div class="c-ux-brand-meta">
                <span class="c-ux-brand-badge">최신 기출 100%</span>
              </div>
            </div>

            <!-- 2. Mode Toggle (Flashcard vs Test) -->
            <div class="c-ux-mode-bar" role="tablist">
              <button type="button" class="c-ux-mode-btn ${this.currentMode === 'flashcard' ? 'active' : ''}" data-mode="flashcard" role="tab">
                <span>🗂️</span> 플래시카드 학습
              </button>
              <button type="button" class="c-ux-mode-btn ${this.currentMode === 'test' ? 'active' : ''}" data-mode="test" role="tab">
                <span>✍️</span> 실전 일차 테스트
              </button>
            </div>

            <!-- 3. Day Navigation Pills (1 ~ 10) -->
            <div class="c-ux-day-nav-wrapper">
              <div class="c-ux-day-nav" id="c-ux-day-scroll-row">
                ${this._renderDayPills()}
              </div>
            </div>

            <!-- 4. Day Progress Card -->
            ${this._renderDayProgressCard()}
          </header>

          <!-- 5. Mode Views -->
          <div class="c-ux-flashcard-view-wrapper ${this.currentMode === 'flashcard' ? '' : 'hidden'}" id="c-ux-flashcard-view">
            ${this._renderFlashcardDeck()}
          </div>

          <div class="c-ux-test-view-wrapper ${this.currentMode === 'test' ? 'active' : ''}" id="c-ux-test-view">
            ${this._renderTestView()}
          </div>

          <div class="c-ux-shortcut-hint">
            💡 단축키: ← 이전 단어 | → 다음 단어 | Space 뜻 토글 | S 발음 | M 암기 체크
          </div>
        </div>
      `;

      this._bindDomEvents();
    }

    _renderDayPills() {
      const pills = [];
      for (let day = 1; day <= 10; day++) {
        const progress = this.getDayProgress(day);
        const isActive = (day === this.currentDay);
        const isDone = progress.isCompleted;
        const subLabel = isDone ? '완료 ✓' : `${progress.mastered}/${progress.total}`;

        pills.push(`
          <button type="button" 
                  class="c-ux-day-pill ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}" 
                  data-day="${day}"
                  aria-selected="${isActive}">
            <span class="c-ux-day-num">Day ${day}</span>
            <span class="c-ux-day-sub">${subLabel}</span>
          </button>
        `);
      }
      return pills.join('');
    }

    _renderDayProgressCard() {
      const p = this.getDayProgress(this.currentDay);
      const isDone = p.isCompleted;
      const statusBadge = isDone 
        ? '<span class="c-ux-progress-badge all-done">전체 암기 완료 🏆</span>' 
        : (p.mastered > 0 
            ? `<span class="c-ux-progress-badge">진행중 (${p.percent}%)</span>` 
            : '<span class="c-ux-progress-badge">미학습</span>');

      return `
        <div class="c-ux-day-progress-card">
          <div class="c-ux-progress-row">
            <div class="c-ux-progress-label">
              <span>Day ${this.currentDay} 학습 진도</span>
              ${statusBadge}
            </div>
            <div class="c-ux-progress-count">
              ${p.mastered} / ${p.total} 단어 (${p.percent}%)
            </div>
          </div>
          <div class="c-ux-progress-bar-track">
            <div class="c-ux-progress-bar-fill ${isDone ? 'all-done' : ''}" style="width: ${p.percent}%;"></div>
          </div>
        </div>
      `;
    }

    _renderFlashcardDeck() {
      const deck = this.getActiveDeck();
      const currentWord = this.getCurrentWord();

      if (deck.length === 0) {
        return `
          <div class="c-ux-card-shell">
            <div class="c-ux-empty-state">
              <div class="c-ux-empty-icon">🎉</div>
              <h2 class="c-ux-empty-title">Day ${this.currentDay} 단어를 모두 외웠습니다!</h2>
              <p class="c-ux-empty-desc">모든 단어가 암기 완료되었습니다. '전체 단어 보기'로 복습하거나 오늘 단어 실전 테스트에 도전해보세요!</p>
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button type="button" class="c-ux-tool-btn" id="c-ux-reset-filter-btn">
                  전체 단어로 복귀
                </button>
                <button type="button" class="c-ux-tool-btn active" id="c-ux-start-test-empty-btn">
                  🚀 실전 테스트 보기
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const totalCards = deck.length;
      const cardNum = this.currentIndex + 1;
      const progressPercent = Math.round((cardNum / totalCards) * 100);
      const isMastered = !!this.masteredMap[currentWord.id];

      // Format Synonyms
      const rawSyn = currentWord.synonyms || '';
      const synList = rawSyn.split(',').map(s => s.trim()).filter(Boolean);

      // College Badge
      const univBadgeClass = getUnivBadgeClass(currentWord.univ);
      const univLabel = currentWord.year ? `${currentWord.univ} ${currentWord.year}` : (currentWord.univ || '편입 기출');

      // Highlight target word in sentence
      const highlightedSentence = highlightWordInSentence(currentWord.sentence, currentWord.word);

      // Check Carried Over (Cascading Review)
      const isCarriedOver = !!currentWord.isCarriedOver;

      return `
        <!-- Flashcard Top Controls -->
        <div class="c-ux-toolbar">
          <div class="c-ux-counter-pill">
            <span>카드</span> <span>${cardNum}</span> / <span>${totalCards}</span>
          </div>
          <div class="c-ux-toolbar-actions">
            <button type="button" class="c-ux-tool-btn ${this.isShuffled ? 'active' : ''}" id="c-ux-shuffle-btn" title="카드 순서 섞기">
              <span>🔀</span> 셔플
            </button>
            <button type="button" class="c-ux-tool-btn ${this.filterUnmasteredOnly ? 'active' : ''}" id="c-ux-filter-btn" title="미암기 단어만 보기">
              <span>🎯</span> 미암기만
            </button>
            <button type="button" class="c-ux-tool-btn ${this.autoRevealMeaning ? 'active' : ''}" id="c-ux-auto-reveal-btn" title="뜻 자동 표시">
              <span>👁️</span> 뜻자동
            </button>
            <button type="button" class="c-ux-tool-btn mastered-btn ${isMastered ? 'is-mastered' : ''}" id="c-ux-master-btn" title="암기 완료 체크">
              <span>${isMastered ? '⭐' : '☆'}</span> ${isMastered ? '외움' : '체크'}
            </button>
          </div>
        </div>

        <!-- The Flashcard Shell -->
        <div class="c-ux-card-shell" id="c-ux-card-target">
          <!-- Top Card Progress Indicator -->
          <div class="c-ux-card-top-track">
            <div class="c-ux-card-top-bar" style="width: ${progressPercent}%;"></div>
          </div>

          <!-- Card Meta Row -->
          <div class="c-ux-meta-row">
            ${isCarriedOver ? `<span class="c-ux-carried-badge">🔄 이전 Day 누적 복습</span>` : ''}
            <span class="c-ux-univ-badge ${univBadgeClass}">
              ★ ${univLabel} ${currentWord.q_num ? `(${currentWord.q_num})` : ''}
            </span>
            <span class="c-ux-pos-badge">${currentWord.pos || '단어'}</span>
            ${currentWord.type ? `<span class="c-ux-type-badge">${currentWord.type}</span>` : ''}
          </div>

          <!-- English Word Hero -->
          <div class="c-ux-word-hero">
            <div class="c-ux-word-text c-ux-word-heading">${currentWord.word}</div>
            <button type="button" class="c-ux-audio-btn" id="c-ux-speak-btn" aria-label="발음 듣기" title="원어민 발음 듣기 (S)">
              🔊
            </button>
          </div>

          <!-- Korean Meaning Section -->
          <div class="c-ux-meaning-box" id="c-ux-meaning-wrapper">
            ${this.meaningVisible ? `
              <div class="c-ux-meaning-revealed">
                <div class="c-ux-meaning-text">${currentWord.meaning}</div>
                <button type="button" class="c-ux-meaning-hide-btn" id="c-ux-hide-meaning-btn">가리기 ✕</button>
              </div>
            ` : `
              <div class="c-ux-meaning-hidden" id="c-ux-reveal-meaning-btn">
                <span>👁️</span> 탭하여 한국어 뜻 보기 (또는 Space)
              </div>
            `}
          </div>

          <!-- Synonyms Group -->
          ${synList.length > 0 ? `
            <div class="c-ux-synonyms-section">
              <div class="c-ux-section-label">
                <span>📚</span> 출제 핵심 동의어
              </div>
              <div class="c-ux-synonym-chips">
                ${synList.map(s => `<span class="c-ux-syn-chip">${s}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Collegiate Context Example Sentence -->
          <div class="c-ux-sentence-section">
            <div class="c-ux-section-label">
              <span>📖</span> 서·성·한 기출 원문 문맥
            </div>
            <div class="c-ux-sentence-en">${highlightedSentence}</div>
            ${currentWord.korean_trans ? `<div class="c-ux-sentence-ko">${currentWord.korean_trans}</div>` : ''}
          </div>

          <!-- Collegiate Tip Box -->
          ${currentWord.tip ? `
            <div class="c-ux-tip-box">
              <span class="c-ux-tip-icon">💡</span>
              <div class="c-ux-tip-content">${currentWord.tip}</div>
            </div>
          ` : ''}
        </div>

        <!-- Navigation Controls -->
        <div class="c-ux-nav-controls">
          <button type="button" class="c-ux-nav-btn" id="c-ux-prev-btn" title="이전 단어 (←)">
            <span>◀</span> 이전
          </button>
          <button type="button" class="c-ux-nav-btn" id="c-ux-toggle-meaning-nav" title="뜻 토글 (Space)">
            <span>👁️</span> 뜻 ${this.meaningVisible ? '가리기' : '보기'}
          </button>
          <button type="button" class="c-ux-nav-btn primary" id="c-ux-next-btn" title="다음 단어 (→)">
            다음 <span>▶</span>
          </button>
        </div>

        <!-- Direct Transition CTA to Test -->
        <button type="button" class="c-ux-test-cta" id="c-ux-main-test-cta">
          <div class="c-ux-test-cta-main">
            <span>🚀</span> 오늘 Day ${this.currentDay} 단어 실전 테스트 시작하기

 *    - 이전 문항 네비게이션 및 실시간 답안 재수정 지원

 *    - 폭포수 누적 복습 분석 (당일 신규 vs 이월 누적 단어 마스터/잔여 현황)
 *    - 필터 탭: [전체 문항 (N)], [오답 단어 (M)], [마스터 단어 (K)]
 *    - 액션 컨트롤:
 *      * [🔄 오답 단어 즉시 재시험] -> 즉시 오답만 모아 재시험 세션 실행
 *      * [📋 오답노트 클립보드 복사] -> 정밀 마크다운 포맷 클립보드 복사 & 토스트
 *      * [➡️ 다음 Day N+1로 이동] -> 다음 일차 진도 자동 전환 및 잠금 해제

  // ----------------------------------------------------------------------------
  // [1] Web Audio Synthesizer (Zero External Dependencies)
  // ----------------------------------------------------------------------------
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
    }

    init() {
      if (this.muted) return;
      if (!this.ctx && typeof window !== 'undefined') {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    play(type) {
      if (this.muted) return;
      try {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        if (type === 'correct') {
          // Ascending dual chime (C5 523Hz -> E5 659Hz)
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(523.25, now);
          osc1.frequency.setValueAtTime(659.25, now + 0.08);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1046.5, now + 0.08);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(now);
          osc2.start(now + 0.08);
          osc1.stop(now + 0.35);
          osc2.stop(now + 0.35);
        } else if (type === 'wrong') {
          // Gentle lower tone (A3 220Hz -> F#3 185Hz)
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(185, now + 0.08);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'complete') {
          // Triad Fanfare (C5 -> E5 -> G5 -> C6)
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startT = now + (idx * 0.1);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startT);

            gain.gain.setValueAtTime(0.16, startT);
            gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.45);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(startT);
            osc.stop(startT + 0.45);
          });
        }
      } catch (e) {
        // AudioContext silent fail safe
      }
    }
  }
